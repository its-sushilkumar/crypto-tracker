<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>8-Bit Crypto Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f051d;
      --panel-bg: #1b0e33;
      --card-bg: #2a164d;
      --text-main: #f3e8ff;
      --text-muted: #a78bfa;
      --cyan: #38bdf8;
      --yellow: #facc15;
      --green: #4ade80;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Press Start 2P', monospace;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .tracker-container {
      background: var(--panel-bg);
      border: 4px solid var(--text-main);
      box-shadow: 6px 6px 0px #000;
      padding: 1.5rem;
      max-width: 420px;
      width: 100%;
    }

    .header {
      font-size: 0.65rem;
      color: var(--yellow);
      margin-bottom: 1rem;
      text-align: center;
      text-shadow: 2px 2px 0px #000;
    }

    .coin-card {
      background: var(--card-bg);
      border: 2px solid var(--text-muted);
      padding: 1rem;
      margin-bottom: 0.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .coin-name {
      font-size: 0.6rem;
      color: var(--cyan);
    }

    .coin-price {
      font-size: 0.6rem;
      color: var(--green);
    }

    .status {
      font-size: 0.5rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 1rem;
    }

    .back-link {
      display: block;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.5rem;
      margin-top: 1.5rem;
      text-align: center;
    }

    .back-link:hover {
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <div class="tracker-container">
    <div class="header">[ LIVE TELEMETRY ]</div>

    <div class="coin-card">
      <span class="coin-name">BITCOIN (BTC)</span>
      <span id="btc-price" class="coin-price">LOADING...</span>
    </div>

    <div class="coin-card">
      <span class="coin-name">ETHEREUM (ETH)</span>
      <span id="eth-price" class="coin-price">LOADING...</span>
    </div>

    <div class="coin-card">
      <span class="coin-name">SOLANA (SOL)</span>
      <span id="sol-price" class="coin-price">LOADING...</span>
    </div>

    <div id="status-text" class="status">FETCHING MARKET DATA...</div>

    <a href="https://home-page-sushil.vercel.app" class="back-link">◀ RETURN TO PORTFOLIO</a>
  </div>

  <script>
    async function fetchCryptoPrices() {
      const statusEl = document.getElementById('status-text');
      try {
        // Public API endpoint from CoinGecko
        const response = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana&vs_currencies=usd');
        const data = await response.json();

        // Inject live values into the DOM
        document.getElementById('btc-price').innerText = `$${data.bitcoin.usd.toLocaleString()}`;
        document.getElementById('eth-price').innerText = `$${data.ethereum.usd.toLocaleString()}`;
        document.getElementById('sol-price').innerText = `$${data.solana.usd.toLocaleString()}`;
        
        statusEl.innerText = "STATUS: SYNCED";
        statusEl.style.color = "var(--green)";
      } catch (error) {
        statusEl.innerText = "ERROR: API LIMIT REACHED";
        statusEl.style.color = "#f87171";
      }
    }

    // Run on load
    fetchCryptoPrices();

    // Refresh every 60 seconds
    setInterval(fetchCryptoPrices, 60000);
  </script>

</body>
</html>
